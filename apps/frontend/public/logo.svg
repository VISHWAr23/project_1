<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Geometric Surgical Disposables / Package Emblem -->
  <g transform="translate(64, 64)">
    <!-- Vertical Bar -->
    <rect x="-10" y="-32" width="20" height="64" rx="6" fill="url(#crossGrad)" />
    <!-- Horizontal Bar -->
    <rect x="-32" y="-10" width="64" height="20" rx="6" fill="url(#crossGrad)" />
    
    <!-- Central Cyan Accent Diamond -->
    <path d="M 0 -14 L 14 0 L 0 14 L -14 0 Z" fill="url(#accentGrad)" />

    <!-- Corner Surgical Shield Accents -->
    <circle cx="-22" cy="-22" r="3.5" fill="#93c5fd" opacity="0.8" />
    <circle cx="22" cy="-22" r="3.5" fill="#93c5fd" opacity="0.8" />
    <circle cx="-22" cy="22" r="3.5" fill="#93c5fd" opacity="0.8" />
    <circle cx="22" cy="22" r="3.5" fill="#93c5fd" opacity="0.8" />
  </g>
</svg>
